@if (totalPages() > 1) {
  <nav class="pager" aria-label="Pagination">
    <button type="button" class="btn btn-secondary" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      Previous
    </button>
    <span class="pager-status">Page {{ page() }} of {{ totalPages() }}</span>
    <button type="button" class="btn btn-secondary" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">
      Next
    </button>
  </nav>
}
